name: HackRF and Pluto checks
on:
  push:
    branches: ["codex/hackrf-simple"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  parser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install 'numpy<2'
      - run: python3 -m unittest discover -s tests -v
  gnuradio:
    runs-on: ubuntu-latest
    container: debian:bookworm-slim
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install distribution SDR packages
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends python3 python3-venv gr-gsm hackrf libiio0 libiio-utils
          python3 -m venv --system-site-packages /tmp/pluto-env
          /tmp/pluto-env/bin/python -m pip install -r requirements-pluto.txt
      - name: Verify dependencies and run real flowgraphs
        run: |
          /tmp/pluto-env/bin/python hackrf_simple.py doctor
          /tmp/pluto-env/bin/python pluto_simple.py doctor
          /tmp/pluto-env/bin/python -m unittest discover -s tests -v
